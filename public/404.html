<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Matemaatika</title>
  <script>
    // Store the full path so the SPA can restore it after redirect to index.html
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;
    sessionStorage.setItem('spa-redirect', path + search + hash);
    // Redirect to the app root (keeps the /Matemaatika/ base)
    window.location.replace('/Matemaatika/');
  </script>
</head>
<body></body>
</html>
